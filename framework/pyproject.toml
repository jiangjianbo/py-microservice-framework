[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serviceframework"
version = "1.0.0"
description = "Logical Microservice Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litestar>=2,<3",
    "pydantic>=2,<3",
    "stevedore>=5.0",
    "uvicorn>=0.20",
    "sqlalchemy>=2",
    "aiosqlite>=0.22.1",
    "grpcio>=1.83.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-mock>=3",
    "aiosqlite>=0.19",
    "opentelemetry-api>=1.0",
    "opentelemetry-sdk>=1.0",
    "grpcio>=1.0",
]

[project.entry-points."backend.services"]

[tool.hatch.build.targets.wheel]
packages = ["src/serviceframework"]
