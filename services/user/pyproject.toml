[project]
name = "user-service"
version = "1.0.0"
description = "用户服务示例"
requires-python = ">=3.12"
dependencies = [
    "litestar>=2",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-mock>=3",
]

[[tool.uv.index]]
name = "backend-local"
url = "../../.repository/simple"